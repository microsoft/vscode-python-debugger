# Run on a schedule
trigger: none
pr: none

schedules:
  - cron: '0 10 * * 1-5' # 10AM UTC (2AM PDT) MON-FRI (VS Code Pre-release builds at 9PM PDT)
    displayName: Nightly Pre-Release Schedule
    always: false # only run if there are source code changes
    branches:
      include:
        - main

resources:
  repositories:
    - repository: templates
      type: git
      name: DevDiv/Pylance-Eng
      ref: refs/heads/users/bschnurr/localization-wrapper
    - repository: translations
      type: github
      name: microsoft/vscode-python-extensions-loc
      ref: refs/heads/dev
      endpoint: Github-Pylance
    - repository: localizationTools
      type: github
      name: microsoft/vscode-common-python-lsp
      ref: d1877b84bb10ff7caa6bd12ab4e75498ba760790
      endpoint: Github-Pylance
variables:
  - name: TeamName
    value: VSCode-python-debugger
  - name: VsixName
    value: python-debugger.vsix
  - name: NPM_CONFIG_REGISTRY
    value: 'https://packagefeedproxy.microsoft.io/npm/'
  - name: PIP_PROXY_INDEX_URL
    value: 'https://packagefeedproxy.microsoft.io/pypi/simple/'

parameters:
  - name: publishExtension
    displayName: ðŸš€ Publish Extension
    type: boolean
    default: true

  - name: buildPlatforms
    type: object
    default:
      - name: Linux
        vsceTarget: ''
      - name: Linux
        packageArch: arm64
        vsceTarget: linux-arm64
      - name: Linux
        packageArch: arm
        vsceTarget: linux-armhf
      - name: Linux
        packageArch: x64
        vsceTarget: linux-x64
      - name: MacOS
        packageArch: arm64
        vsceTarget: darwin-arm64
      - name: MacOS
        packageArch: x64
        vsceTarget: darwin-x64
      - name: Windows
        packageArch: arm
        vsceTarget: win32-arm64
      - name: Windows
        packageArch: x64
        vsceTarget: win32-x64

  - name: buildSteps
    type: stepList
    default:
      - script: npm run ci:msft
        displayName: Install NPM dependencies

      - script: python -m pip install -U pip
        displayName: Upgrade pip
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m pip install wheel
        displayName: Install wheel
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m pip install nox
        displayName: Install nox
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python -m nox --session install_bundled_libs
        displayName: Install Python dependencies
        env:
          PIP_INDEX_URL: $(PIP_PROXY_INDEX_URL)

      - script: python ./build/update_ext_version.py --for-publishing
        displayName: Update build number

      - pwsh: Copy-Item -Path "pre-built/*" -Destination "." -Recurse -Force
        displayName: Copy pre-built files

      - script: npm run package
        displayName: Build extension

extends:
  template: azure-pipelines/extension/pre-release.yml@templates
  parameters:
    buildPlatforms: ${{ parameters.buildPlatforms }}
    buildSteps: ${{ parameters.buildSteps }}
    standardizedVersioning: true
    customNPMRegistry: $(NPM_CONFIG_REGISTRY)
    publishExtension: ${{ parameters.publishExtension }}
    teamName: $(TeamName)
    ghCreateTag: true
    ghCreateRelease: true
    ghReleaseAddChangeLog: true
    sourceAnalysisPool: VSEng-MicroBuildVSStable
    pullLocalization: true
