name: Localization

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - package.nls.json
      - src/**/*.ts
      - .github/workflows/localization.yml

permissions:
  contents: read

concurrency:
  group: localization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  localization:
    if: github.repository == 'microsoft/vscode-python-debugger'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: microsoft/vscode-python-ci/actions/localization@2f06c1206c8644c50f99228a111e8c15e33e7828
        with:
          app-id: ${{ vars.PYTHON_LOCALIZATION_APP_ID }}
          private-key: ${{ secrets.PYTHON_LOCALIZATION_PRIVATE_KEY }}
          npm-registry: https://registry.npmjs.org/
