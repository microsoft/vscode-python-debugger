name: Issue labels

on:
  issues:
    types: [opened, reopened]

env:
  NPM_CONFIG_REGISTRY: https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/
  TRIAGERS: '["karthiknadig","eleanorjboyd","anthonykim1"]'

permissions:
  issues: write

jobs:
  # From https://github.com/marketplace/actions/github-script#apply-a-label-to-an-issue.
  add-classify-label:
    name: "Add 'triage-needed' and remove assignees"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Checkout feed authentication action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-actions
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/authenticate-feeds/
            /build/setup-github-feeds.js
            /build/package-feeds.json
          sparse-checkout-cone-mode: false

      - name: Authenticate package feeds
        uses: ./ci-actions/.github/actions/authenticate-feeds

      - name: Checkout Actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'microsoft/vscode-github-triage-actions'
          ref: stable
          path: ./actions

      - name: Install Actions
        run: npm install --production --prefix ./actions

      - name: "Add 'triage-needed' and remove assignees"
        uses: ./actions/python-issue-labels
        with:
          triagers: ${{ env.TRIAGERS }}
          token: ${{secrets.GITHUB_TOKEN}}
