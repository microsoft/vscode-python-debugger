name: Info-Needed Closer
on:
  schedule:
    - cron: 20 12 * * * # 5:20am Redmond
  repository_dispatch:
    types: [trigger-needs-more-info]
  workflow_dispatch:

permissions:
  issues: write

env:
  NPM_CONFIG_REGISTRY: https://devdiv.pkgs.visualstudio.com/DevDiv/_packaging/Pylance_PublicPackages/npm/registry/

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Checkout feed authentication action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-actions
          persist-credentials: false
          sparse-checkout: |
            /.github/actions/authenticate-feeds/
            /build/setup-github-feeds.js
            /build/package-feeds.json
          sparse-checkout-cone-mode: false

      - name: Authenticate package feeds
        uses: ./ci-actions/.github/actions/authenticate-feeds

      - name: Checkout Actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'microsoft/vscode-github-triage-actions'
          path: ./actions
          ref: stable
      - name: Install Actions
        run: npm install --production --prefix ./actions
      - name: Run info-needed Closer
        uses: ./actions/needs-more-info-closer
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          label: info-needed
          closeDays: 30
          closeComment: "Because we have not heard back with the information we requested, we are closing this issue for now. If you are able to provide the info later on, then we will be happy to re-open this issue to pick up where we left off. \n\nHappy Coding!"
          pingDays: 30
          pingComment: "Hey @${assignee}, this issue might need further attention.\n\n@${author}, you can help us out by closing this issue if the problem no longer exists, or adding more information."
